<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ball Up</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <header>
        <div>
          <p class="eyebrow">BALL UP · MERGE LAB</p>
          <h1>合成小球</h1>
          <p class="hint">左右拖拽瞄准，松开投放。相同大小的小球碰撞后会合成为更大的球。</p>
        </div>
        <div class="stats"><span>分数 <strong id="score">0</strong></span><button id="restart">重新开始</button></div>
      </header>
      <nav class="mode-bar" aria-label="游戏模式"><span>模式</span><button class="mode active" data-mode="classic">经典</button><button class="mode" data-mode="timed">60秒挑战</button><button class="mode" data-mode="free">轻松模式</button><span class="timer" id="timer">∞</span></nav>
      <section class="board-wrap">
        <canvas id="game" aria-label="合成小球游戏区域"></canvas>
        <div id="game-over" class="game-over hidden"><h2>游戏结束</h2><p>球堆超过了危险线</p><button id="restart-overlay">再来一局</button></div>
      </section>
      <div class="game-info"><span><b id="combo">0</b> COMBO</span><span>最高分 <b id="best-score">0</b></span><span>已发现 <b id="discovered">1/7</b></span></div>
      <p class="legend"><span class="dot"></span>危险线　 <span class="key">鼠标 / 触摸</span> 拖拽投放</p>
      <section class="progress-grid"><div class="collection-card"><div class="section-title"><h2>球球图鉴</h2><span>合成解锁</span></div><div id="collection" class="collection"></div></div><div class="task-card"><div class="section-title"><h2>今日任务</h2><span id="task-date"></span></div><div id="tasks"></div></div></section>
      <section class="creator-panel">
        <div class="panel-heading"><div><p class="eyebrow">MY BALLS</p><h2>DIY 球球实验室</h2></div><span id="save-status">设置会自动保存在本机</span></div>
        <p class="panel-copy">每个等级都有颜色提示。点击卡片里的大按钮更换照片或音效；内容只保存在当前浏览器中，不会上传。</p>
        <div class="theme-row"><span>快速参考预设</span><button class="theme-button dragon" data-theme="dragon">奶龙风</button><button class="theme-button court" data-theme="court">篮球梗风</button></div>
        <div id="customizer" class="customizer"></div>
        <div class="preset-actions"><button id="save-preset">保存预设</button><label class="upload-preset" for="preset-file">上传预设文件<input id="preset-file" type="file" accept="application/json,.json" /></label><button id="reset-preset" class="ghost">恢复默认</button></div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
    <script src="game.js"></script>
  </body>
</html>
